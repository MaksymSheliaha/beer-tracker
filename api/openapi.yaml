openapi: 3.0.3
info:
  title: Beer Tracker REST API
  description: "# Beer Tracker Backend REST API Specification\n\nСпецифікація інтерфейсу системи обліку споживання пива, персональної\
    \ аналітики та краудсорсингового каталогу на wiki-засадах.\n\n**Методологія розробки:** API-First RESTful Architecture,\
    \ Specification-Driven Development (SDD), Test-Driven Development (TDD).  \n**Нормативні документи:** SRS v2.1.0, Domain\
    \ Glossary v2.0.0, BDD Scenarios (BDD-SCN-001..005).  \n**Автентифікація:** Stateless JWT (Bearer token).\n"
  version: 2.1.0
  contact:
    name: Beer Tracker Engineering Team
    email: dev@beertracker.local
servers:
- url: https://api.beertracker.local/api/v1
  description: Production API Server
- url: http://localhost:8080/api/v1
  description: Local Development & Testing Server
security:
- BearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Реєстрація нового користувача
      description: '**REQ-ID:** REQ-NF-004, REQ-NF-006, REQ-NF-008


        Створює новий обліковий запис користувача. Зберігає солений хеш пароля (Argon2id/BCrypt), призначає базову роль `USER`
        та фіксує таймзону IANA.

        '
      operationId: registerUser
      x-req-id:
      - REQ-NF-004
      - REQ-NF-006
      - REQ-NF-008
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
            examples:
              standard_user:
                summary: Валідні дані реєстрації нового користувача
                value:
                  email: user@example.com
                  password: SuperSecretPassword123!
                  timezone: Europe/Kyiv
      responses:
        '201':
          description: Користувача успішно зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                created_user:
                  summary: Створений обліковий запис
                  value:
                    id: u0a80123-4201-4444-9999-0123456789ab
                    email: user@example.com
                    role: USER
                    timezone: Europe/Kyiv
                    created_at: '2026-10-20T12:00:00Z'
        '400':
          description: Некоректний синтаксис запиту (Invalid JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                malformed_json:
                  summary: Синтаксична помилка JSON
                  value:
                    code: MALFORMED_JSON
                    message: Failed to parse request JSON payload
                    details:
                    - field: body
                      issue: Unexpected token at line 2
                    timestamp: '2026-10-20T12:00:01Z'
                    traceId: t0a80123-0001-4444-9999-0123456789ab
        '409':
          description: Користувач із вказаним email уже зареєстрований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_conflict:
                  summary: Конфлікт унікальності email
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: User with email 'user@example.com' already exists
                    details:
                    - field: email
                      issue: Email address is already registered in the system
                    timestamp: '2026-10-20T12:00:02Z'
                    traceId: t0a80123-0002-4444-9999-0123456789ab
        '422':
          description: Семантична помилка валідації полів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_timezone:
                  summary: Некоректна таймзона або слабкий пароль
                  value:
                    code: UNPROCESSABLE_ENTITY
                    message: Validation failed for registration parameters
                    details:
                    - field: timezone
                      issue: Unknown IANA timezone 'Invalid/Zone'
                    - field: password
                      issue: Password must be at least 8 characters long
                    timestamp: '2026-10-20T12:00:03Z'
                    traceId: t0a80123-0003-4444-9999-0123456789ab
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Вхід та отримання токенів (Access + Refresh)
      description: '**REQ-ID:** REQ-NF-004, REQ-NF-006, REQ-NF-008


        Перевіряє облікові дані користувача та повертає JWT пару токенів (Access 15 хв, Refresh 30 днів).

        '
      operationId: loginUser
      x-req-id:
      - REQ-NF-004
      - REQ-NF-006
      - REQ-NF-008
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            examples:
              standard_login:
                summary: Логін і пароль користувача
                value:
                  email: user@example.com
                  password: SuperSecretPassword123!
      responses:
        '200':
          description: Успішна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                auth_tokens:
                  summary: Видані JWT токени
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1MGE4MDEyMy00MjAxLTQ0NDQtOTk5OS0wMTIzNDU2Nzg5YWIiLCJyb2xlIjoiVVNFUiIsImV4cCI6MTgwMDAwMDAwMH0.signature
                    refresh_token: r0a80123-9999-4444-8888-0123456789ab
                    token_type: Bearer
                    expires_in: 900
        '401':
          description: Невірний логін або пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_credentials:
                  summary: Невірні облікові дані
                  value:
                    code: INVALID_CREDENTIALS
                    message: Invalid email or password
                    details:
                    - field: credentials
                      issue: Authentication failed for provided credentials
                    timestamp: '2026-10-20T12:01:00Z'
                    traceId: t0a80123-0004-4444-9999-0123456789ab
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Оновлення JWT токенів з одноразовою ротацією
      description: '**REQ-ID:** REQ-NF-004, REQ-NF-008


        Приймає дійсний Refresh-токен, інвалідує його (ротація) та повертає нову пару Access і Refresh токенів.

        '
      operationId: refreshToken
      x-req-id:
      - REQ-NF-004
      - REQ-NF-008
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              refresh_token_payload:
                summary: Передача діючого Refresh-токена
                value:
                  refresh_token: r0a80123-9999-4444-8888-0123456789ab
      responses:
        '200':
          description: Токени успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                rotated_tokens:
                  summary: Нова пара токенів
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new_access_token.signature
                    refresh_token: r0a80123-1111-4444-2222-0123456789ab
                    token_type: Bearer
                    expires_in: 900
        '401':
          description: Недійсний, прострочений або скомпрометований Refresh-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired_refresh_token:
                  summary: Прострочений токен
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: The provided refresh token is expired or revoked
                    details:
                    - field: refresh_token
                      issue: Token signature expired or token already rotated
                    timestamp: '2026-10-20T12:02:00Z'
                    traceId: t0a80123-0005-4444-9999-0123456789ab
  /beers:
    get:
      tags:
      - Catalog
      summary: Пошук та фільтрація списку сортів пива
      description: '**REQ-ID:** REQ-F-001, REQ-NF-001, REQ-NF-008


        Повертає сторінковий список активних продуктів каталогу. Підтримує повнотекстовий пошук за назвою або броварнею, фільтрацію
        за стилем, країною, типом товару (`PACKAGED`/`DRAFT`), штрих-кодом та сортування.

        '
      operationId: listBeers
      x-req-id:
      - REQ-F-001
      - REQ-NF-001
      - REQ-NF-008
      security: []
      parameters:
      - name: query
        in: query
        description: Текстовий запит для пошуку за назвою або броварнею
        required: false
        schema:
          type: string
          example: Varvar IPA
      - name: brewery
        in: query
        description: Фільтр за точною назвою броварні
        required: false
        schema:
          type: string
          example: Varvar
      - name: style
        in: query
        description: Фільтр за стилем пива
        required: false
        schema:
          type: string
          example: India Pale Ale
      - name: country
        in: query
        description: Фільтр за двобуквеним кодом країни (ISO 3166-1 alpha-2)
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
          example: UA
      - name: beer_type
        in: query
        description: Фільтр за типом товару (фасоване чи розливне)
        required: false
        schema:
          type: string
          enum:
          - PACKAGED
          - DRAFT
      - name: barcode
        in: query
        description: Пошук за числовим рядком штрих-коду упаковки
        required: false
        schema:
          type: string
          example: '4820000000001'
      - name: page
        in: query
        description: Номер сторінки (починаючи з 0)
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Кількість елементів на сторінці (1..100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        description: Параметр сортування у форматі `field,direction`
        required: false
        schema:
          type: string
          default: name,asc
          example: rating_avg,desc
      responses:
        '200':
          description: Сторінковий список знайдених продуктів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerPagedResponse'
              examples:
                varvar_catalog_list:
                  summary: Список знайдених позицій
                  value:
                    items:
                    - id: b0a80123-0012-4444-9999-0123456789ab
                      name: Varvar Artisan IPA
                      brewery: Varvar
                      style: India Pale Ale
                      abv: 6.0
                      beer_type: PACKAGED
                      description: Флагманський IPA від київської броварні Varvar
                      country: UA
                      image_url: https://cdn.beertracker.local/beers/varvar-ipa.jpg
                      status: VERIFIED
                      rating_avg: 4.4
                      reviews_count: 85
                      packagings:
                      - id: p0a80123-0033-4444-9999-0123456789ab
                        beer_id: b0a80123-0012-4444-9999-0123456789ab
                        volume_ml: 500
                        package_type: BOTTLE
                        barcode: '4820199990012'
                      created_at: '2026-08-15T10:00:00Z'
                    page: 0
                    size: 20
                    total_elements: 1
                    total_pages: 1
                    has_next: false
                    has_previous: false
        '400':
          description: Невалідні параметри пагінації або сортування
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_page_size:
                  summary: Некоректний розмір сторінки
                  value:
                    code: INVALID_PAGE_SIZE
                    message: Parameter 'size' exceeds maximum allowed limit of 100
                    details:
                    - field: size
                      issue: Must be between 1 and 100
                    timestamp: '2026-10-20T12:05:00Z'
                    traceId: t0a80123-0006-4444-9999-0123456789ab
    post:
      tags:
      - Catalog
      summary: Реєстрація нового продукту в каталозі
      description: '**REQ-ID:** REQ-F-001, REQ-F-002, REQ-NF-008


        Створює новий сорт пива з початковим статусом `UNVERIFIED`.


        **Правила валідації:**

        - Має містити щонайменше 1 варіант пакування (AC-001.2);

        - Об''єм кожного пакування в межах [50..10000] мл (AC-001.2);

        - Для `beer_type = DRAFT` дозволено тільки `package_type = DRAFT` (AC-001.3);

        - Для `beer_type = PACKAGED` заборонено `package_type = DRAFT` (AC-001.4);

        - Пара `(brewery, name)` повинна бути унікальною без урахування регістру (AC-002.1);

        - Штрих-коди пакувань мають бути унікальними в межах системи (AC-002.2, BDD-SCN-004).

        '
      operationId: createBeer
      x-req-id:
      - REQ-F-001
      - REQ-F-002
      - REQ-NF-008
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerCreateRequest'
            examples:
              mova_dark_stout:
                summary: Створення сорту Mova Dark Stout (відповідає BDD-SCN-001)
                value:
                  name: Mova Dark Stout
                  brewery: Mova Brewing Co.
                  style: Oatmeal Stout
                  abv: 5.8
                  beer_type: PACKAGED
                  description: Насичений темний стаут з вівсяними пластівцями
                  country: UA
                  image_url: https://cdn.beertracker.local/beers/mova-stout.png
                  packagings:
                  - volume_ml: 500
                    package_type: CAN
                    barcode: '4820202600018'
              draft_beer_sample:
                summary: Створення розливного пива Draft Beer
                value:
                  name: Varvar Golden Ale On Tap
                  brewery: Varvar
                  style: Golden Ale
                  abv: 5.0
                  beer_type: DRAFT
                  description: Свіже розливне пиво в кегах для барів
                  country: UA
                  packagings:
                  - volume_ml: 500
                    package_type: DRAFT
                  - volume_ml: 300
                    package_type: DRAFT
      responses:
        '201':
          description: Продукт успішно зареєстровано зі статусом UNVERIFIED
          headers:
            Location:
              description: URI створеного продукту
              schema:
                type: string
                example: /api/v1/beers/b0a80123-0001-4444-9999-0123456789ab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerResponse'
              examples:
                created_mova:
                  summary: Створений запис пива
                  value:
                    id: b0a80123-0001-4444-9999-0123456789ab
                    name: Mova Dark Stout
                    brewery: Mova Brewing Co.
                    style: Oatmeal Stout
                    abv: 5.8
                    beer_type: PACKAGED
                    description: Насичений темний стаут з вівсяними пластівцями
                    country: UA
                    image_url: https://cdn.beertracker.local/beers/mova-stout.png
                    status: UNVERIFIED
                    rating_avg: null
                    reviews_count: 0
                    packagings:
                    - id: p0a80123-0001-4444-9999-0123456789ab
                      beer_id: b0a80123-0001-4444-9999-0123456789ab
                      volume_ml: 500
                      package_type: CAN
                      barcode: '4820202600018'
                    created_at: '2026-10-20T12:10:00Z'
        '400':
          description: Некоректний синтаксис запиту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request_syntax:
                  summary: Помилка формату
                  value:
                    code: BAD_REQUEST
                    message: Required field 'name' is missing or empty
                    details:
                    - field: name
                      issue: Field is required and cannot be blank
                    timestamp: '2026-10-20T12:10:01Z'
                    traceId: t0a80123-0007-4444-9999-0123456789ab
        '401':
          description: Автентифікація відсутня або недійсна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_error:
                  summary: Відсутній Bearer токен
                  value:
                    code: UNAUTHORIZED
                    message: Full authentication is required to access this resource
                    details:
                    - field: Authorization
                      issue: Bearer token missing or invalid
                    timestamp: '2026-10-20T12:10:02Z'
                    traceId: t0a80123-0008-4444-9999-0123456789ab
        '409':
          description: Конфлікт унікальності (дублікат назви або штрих-коду)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate_barcode_conflict:
                  summary: Дублікат штрих-коду (BDD-SCN-004)
                  value:
                    code: DUPLICATE_BARCODE_CONFLICT
                    message: Штрих-код 8594404110123 уже прив'язаний до іншого товару
                    details:
                    - field: packagings[0].barcode
                      issue: Barcode 8594404110123 is already assigned to Pilsner Urquell
                    timestamp: '2026-10-20T12:10:03Z'
                    traceId: t0a80123-0009-4444-9999-0123456789ab
                duplicate_name_conflict:
                  summary: Дублікат назви та броварні
                  value:
                    code: DUPLICATE_BEER_NAME_CONFLICT
                    message: Beer with name 'Mova Dark Stout' and brewery 'Mova Brewing Co.' already exists
                    details:
                    - field: name
                      issue: Conflict on unique combination (brewery, name)
                    timestamp: '2026-10-20T12:10:04Z'
                    traceId: t0a80123-0010-4444-9999-0123456789ab
        '422':
          description: Порушення правил валідації тари або несумісність типів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                draft_type_mismatch:
                  summary: Несумісність типу тари для DRAFT (AC-001.3)
                  value:
                    code: INVALID_PACKAGE_TYPE_FOR_DRAFT
                    message: All packagings for DRAFT beer must have package_type DRAFT
                    details:
                    - field: packagings[0].package_type
                      issue: Found 'BOTTLE' for beer_type 'DRAFT'
                    timestamp: '2026-10-20T12:10:05Z'
                    traceId: t0a80123-0011-4444-9999-0123456789ab
                volume_out_of_bounds:
                  summary: Неприпустимий об'єм тари (AC-001.2)
                  value:
                    code: VOLUME_OUT_OF_BOUNDS
                    message: Packaging volume must be strictly between 50 and 10000 ml
                    details:
                    - field: packagings[0].volume_ml
                      issue: Volume 30 ml is below minimum allowed 50 ml
                    timestamp: '2026-10-20T12:10:06Z'
                    traceId: t0a80123-0012-4444-9999-0123456789ab
  /beers/{id}:
    get:
      tags:
      - Catalog
      summary: Отримання картки продукту за ID
      description: '**REQ-ID:** REQ-F-001, REQ-F-003, REQ-F-010, REQ-NF-008


        Повертає повну інформацію про сорт пива. За замовчуванням повертає найновішу запропоновану чернетку версії; якщо передано
        `verified_only=true`, повертає діючу верифіковану базу (AC-003.3).

        '
      operationId: getBeerById
      x-req-id:
      - REQ-F-001
      - REQ-F-003
      - REQ-F-010
      - REQ-NF-008
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: Унікальний ідентифікатор товару (UUID)
        schema:
          type: string
          format: uuid
          example: b0a80123-0012-4444-9999-0123456789ab
      - name: verified_only
        in: query
        required: false
        description: Ознака повернення виключно верифікованої версії
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Картку товару успішно знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerResponse'
              examples:
                varvar_detail:
                  summary: Повна картка сорту Varvar IPA
                  value:
                    id: b0a80123-0012-4444-9999-0123456789ab
                    name: Varvar Artisan IPA
                    brewery: Varvar
                    style: India Pale Ale
                    abv: 6.0
                    beer_type: PACKAGED
                    description: Флагманський IPA від київської броварні Varvar
                    country: UA
                    image_url: https://cdn.beertracker.local/beers/varvar-ipa.jpg
                    status: VERIFIED
                    rating_avg: 4.4
                    reviews_count: 85
                    packagings:
                    - id: p0a80123-0033-4444-9999-0123456789ab
                      beer_id: b0a80123-0012-4444-9999-0123456789ab
                      volume_ml: 500
                      package_type: BOTTLE
                      barcode: '4820199990012'
                    created_at: '2026-08-15T10:00:00Z'
        '404':
          description: Товар не знайдено або він видалений (is_deleted = true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                beer_not_found:
                  summary: Товар не існує
                  value:
                    code: BEER_NOT_FOUND
                    message: Beer with specified identifier was not found
                    details:
                    - field: id
                      issue: No active record found for ID 'b0a80123-9999-4444-9999-0123456789ab'
                    timestamp: '2026-10-20T12:15:00Z'
                    traceId: t0a80123-0013-4444-9999-0123456789ab
    delete:
      tags:
      - Administration
      summary: М'яке видалення товару модератором (Soft Delete / Placeholder)
      description: '**REQ-ID:** REQ-F-010, REQ-NF-008


        Виконує soft delete продукту модератором. Запис не знищується фізично: позначається `is_deleted = true`, приховується
