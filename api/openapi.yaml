    delete:
      tags:
      - Collection & Wishlist
      summary: Ручне видалення товару зі списку бажань
      description: '**REQ-ID:** REQ-F-009, REQ-NF-005, REQ-NF-008


        Видаляє товар зі списку бажань. Якщо товар не був у списку поточного користувача — повертає `404 Not Found` (забезпечення
        ізоляції OWASP, REQ-NF-005).

        '
      operationId: removeWishlistItem
      x-req-id:
      - REQ-F-009
      - REQ-NF-005
      - REQ-NF-008
      security:
      - BearerAuth: []
      parameters:
      - name: beer_id
        in: path
        required: true
        description: Ідентифікатор товару (UUID)
        schema:
          type: string
          format: uuid
          example: b0a80123-0001-4444-9999-0123456789ab
      responses:
        '204':
          description: Товар видалено зі списку бажань
        '401':
          description: Відсутня автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error_401_removeWishlistItem:
                  summary: Відсутній або прострочений Bearer токен
                  value:
                    code: UNAUTHORIZED
                    message: Full authentication is required to access this resource
                    details:
                    - field: Authorization
