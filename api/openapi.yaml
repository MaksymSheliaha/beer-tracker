                wishlist_not_found:
                  summary: Товар відсутній у вішлісті
                  value:
                    code: WISHLIST_ITEM_NOT_FOUND
                    message: Beer not found in current user's wishlist
                    details:
                    - field: beer_id
                      issue: No matching wishlist item found
                    timestamp: '2026-10-20T13:20:01Z'
                    traceId: t0a80123-0028-4444-9999-0123456789ab
  /collections/tasted:
    get:
      tags:
      - Collection & Wishlist
      summary: Перегляд віртуальної дегустаційної колекції (Tasted Collection)
      description: '**REQ-ID:** REQ-F-009, REQ-NF-005, REQ-NF-008


        Повертає список усіх унікальних сортів пива, які користувач коли-небудь споживав (віртуальна проекція над журналом
        `ConsumptionEntry`).

        '
      operationId: getTastedCollection
      x-req-id:
      - REQ-F-009
      - REQ-NF-005
      - REQ-NF-008
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: last_consumed_at,desc
      responses:
        '200':
