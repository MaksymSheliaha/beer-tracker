          - BOTTLE
          - CAN
          - DRAFT
          - KEG
          description: Фізичний тип тари
          example: CAN
        barcode:
          type: string
          pattern: ^[0-9]{8,14}$
          nullable: true
          description: Унікальний числовий штрих-код (EAN-8, EAN-13, UPC)
          example: '4820202600018'
    BeerPackagingResponse:
      type: object
