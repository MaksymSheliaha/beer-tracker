                      brewery: Mova Brewing Co.
                      total_volume_ml: 1000
                      first_consumed_at: '2026-09-20T20:30:00Z'
                      last_consumed_at: '2026-09-20T20:30:00Z'
                      user_rating: 4.5
                    page: 0
                    size: 20
                    total_elements: 1
                    total_pages: 1
        '401':
          description: Відсутня автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error_401_getTastedCollection:
                  summary: Відсутній або прострочений Bearer токен
                  value:
                    code: UNAUTHORIZED
                    message: Full authentication is required to access this resource
                    details:
                    - field: Authorization
                      issue: Missing or invalid Bearer JWT token
                    timestamp: '2026-10-20T18:00:00Z'
                    traceId: t0a80123-0401-4444-9999-0123456789ab
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateless JSON Web Token у заголовку Bearer authorization
  schemas:
    ErrorResponse:
      type: object
      description: Єдина стандартизована схема повернення помилок 4xx та 5xx (згідно з RFC 7807 та специфікацією)
      required:
      - code
      - message
      - details
      - timestamp
      - traceId
      properties:
        code:
          type: string
          description: Машиночитний код помилки
          example: UNPROCESSABLE_ENTITY
        message:
          type: string
          description: Людиночитне узагальнене повідомлення про помилку
          example: Validation failed for one or more fields
        details:
          type: array
          description: Масив конкретних деталей помилок за полями
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          description: Часова мітка виникнення помилки в UTC
          example: '2026-10-20T18:30:00Z'
        traceId:
          type: string
          format: uuid
          description: Унікальний ідентифікатор трасування запиту (MDC trace_id)
          example: c0a80123-7777-4444-9999-0123456789ab
    ErrorDetail:
      type: object
      description: Деталь помилки конкретного параметра чи інваріанта
      required:
      - field
      - issue
      properties:
        field:
          type: string
          description: Назва поля запиту, заголовка або бізнес-правила
          example: quantity
        issue:
          type: string
          description: Пояснення причини невалідності
          example: Quantity must be an integer between 1 and 100
    UserRegisterRequest:
      type: object
      description: DTO запиту на реєстрацію нового користувача
      required:
      - email
      - password
      - timezone
      properties:
        email:
          type: string
          format: email
          description: Унікальна електронна пошта користувача
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Пароль користувача (мінімум 8 символів)
          example: SuperSecretPassword123!
        timezone:
          type: string
          description: Часовий пояс IANA
          example: Europe/Kyiv
    UserLoginRequest:
      type: object
      description: DTO запиту на отримання токенів
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SuperSecretPassword123!
    RefreshTokenRequest:
      type: object
      description: DTO запиту на оновлення токенів
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Діючий одноразовий Refresh токен
          example: r0a80123-9999-4444-8888-0123456789ab
    TokenResponse:
      type: object
      description: Пара JWT токенів автентифікації
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT Access токен (термін дії 15 хв)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.token
        refresh_token:
          type: string
          description: Ротований Refresh токен (термін дії 30 днів)
          example: r0a80123-9999-4444-8888-0123456789ab
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Час життя Access токена в секундах
          example: 900
    UserResponse:
      type: object
      description: Публічне представлення користувача (без полів пароля)
      required:
      - id
      - email
      - role
      - timezone
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: u0a80123-4201-4444-9999-0123456789ab
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum:
          - USER
          - MODERATOR
          example: USER
        timezone:
          type: string
          example: Europe/Kyiv
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00Z'
    BeerPackagingCreateRequest:
      type: object
      description: DTO створення варіанту тари для пива
      required:
      - volume_ml
      - package_type
      properties:
        volume_ml:
          type: integer
          minimum: 50
          maximum: 10000
          description: Об'єм у мілілітрах (50..10000 мл)
          example: 500
        package_type:
          type: string
          enum:
          - BOTTLE
          - CAN
          - DRAFT
          - KEG
          description: Фізичний тип тари
          example: CAN
        barcode:
          type: string
          pattern: ^[0-9]{8,14}$
          nullable: true
          description: Унікальний числовий штрих-код (EAN-8, EAN-13, UPC)
          example: '4820202600018'
    BeerPackagingResponse:
      type: object
      description: Представлення тари у відповіді
      required:
      - id
      - beer_id
      - volume_ml
      - package_type
      properties:
        id:
          type: string
          format: uuid
          example: p0a80123-0001-4444-9999-0123456789ab
        beer_id:
          type: string
          format: uuid
          example: b0a80123-0001-4444-9999-0123456789ab
        volume_ml:
          type: integer
          example: 500
        package_type:
          type: string
          enum:
          - BOTTLE
          - CAN
          - DRAFT
          - KEG
          example: CAN
        barcode:
          type: string
          nullable: true
          example: '4820202600018'
    BeerCreateRequest:
      type: object
      description: DTO створення нового сорту пива
      required:
      - name
      - brewery
      - style
      - abv
      - beer_type
      - packagings
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Назва сорту пива
          example: Mova Dark Stout
        brewery:
          type: string
          minLength: 1
          maxLength: 255
          description: Назва броварні-виробника
          example: Mova Brewing Co.
        style:
          type: string
          minLength: 1
          maxLength: 100
          description: Стиль пива (IPA, Stout, Lager тощо)
          example: Oatmeal Stout
        abv:
          type: number
          format: float
          minimum: 0.0
          maximum: 100.0
          description: Вміст алкоголю за об'ємом (ABV %)
          example: 5.8
        beer_type:
          type: string
          enum:
          - PACKAGED
          - DRAFT
          description: Тип продукту (фасоване чи розливне)
          example: PACKAGED
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Опис та смаковий профіль
          example: Насичений темний стаут з вівсяними пластівцями
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          nullable: true
          description: Двобуквений код країни походження (ISO 3166-1 alpha-2)
          example: UA
        image_url:
          type: string
          format: uri
          nullable: true
          description: URL завантаженого зображення етикетки
          example: https://cdn.beertracker.local/beers/mova-stout.png
        packagings:
          type: array
          minItems: 1
          description: Список доступних варіантів тари (щонайменше один)
          items:
            $ref: '#/components/schemas/BeerPackagingCreateRequest'
    BeerResponse:
      type: object
      description: Повне представлення сорту пива в каталозі
      required:
      - id
      - name
      - brewery
      - style
      - abv
      - beer_type
      - status
      - packagings
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: b0a80123-0001-4444-9999-0123456789ab
        name:
          type: string
          example: Mova Dark Stout
        brewery:
          type: string
          example: Mova Brewing Co.
        style:
          type: string
          example: Oatmeal Stout
        abv:
          type: number
          format: float
          example: 5.8
        beer_type:
          type: string
          enum:
          - PACKAGED
          - DRAFT
          example: PACKAGED
        description:
          type: string
          nullable: true
          example: Насичений темний стаут з вівсяними пластівцями
        country:
          type: string
          nullable: true
          example: UA
        image_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.beertracker.local/beers/mova-stout.png
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - REJECTED
          - MERGED
          example: VERIFIED
        rating_avg:
          type: number
          format: float
          nullable: true
          example: 4.5
        reviews_count:
          type: integer
          example: 12
        packagings:
          type: array
          items:
            $ref: '#/components/schemas/BeerPackagingResponse'
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00Z'
    BeerPagedResponse:
      type: object
      description: Сторінкова відповідь каталогу
      required:
      - items
      - page
      - size
      - total_elements
      - total_pages
      - has_next
      - has_previous
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BeerResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elements:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 1
        has_next:
          type: boolean
          example: false
        has_previous:
          type: boolean
          example: false
    BeerVersionCreateRequest:
      type: object
      description: DTO створення чернетки версії продукту
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        brewery:
          type: string
          minLength: 1
          maxLength: 255
        style:
          type: string
          minLength: 1
          maxLength: 100
        abv:
          type: number
          format: float
          minimum: 0.0
          maximum: 100.0
        beer_type:
          type: string
          enum:
          - PACKAGED
          - DRAFT
        description:
          type: string
          maxLength: 2000
        country:
          type: string
          minLength: 2
          maxLength: 2
        image_url:
          type: string
          format: uri
        packagings:
          type: array
          items:
            $ref: '#/components/schemas/BeerPackagingCreateRequest'
    BeerVersionResponse:
      type: object
      description: Представлення версії продукту
      required:
      - id
      - beer_id
      - author_id
      - payload
      - confirm_votes
      - reject_votes
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: v0a80123-0002-4444-9999-0123456789ab
        beer_id:
          type: string
          format: uuid
          example: b0a80123-0012-4444-9999-0123456789ab
        author_id:
          type: string
          format: uuid
          example: u0a80123-4201-4444-9999-0123456789ab
        payload:
          type: object
          description: Знімок запропонованих змін
        confirm_votes:
          type: integer
          example: 4
        reject_votes:
          type: integer
          example: 0
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - REJECTED
          example: UNVERIFIED
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T12:25:00Z'
    BeerVersionVoteRequest:
      type: object
      description: DTO відправки голосу за версію
      required:
      - vote_type
      properties:
        vote_type:
          type: string
          enum:
          - CONFIRM
          - REJECT
          example: CONFIRM
    BeerVersionVoteResponse:
      type: object
      description: Результат фіксації голосу
      required:
      - version_id
      - confirm_votes
      - reject_votes
      - status
      - message
      properties:
        version_id:
          type: string
          format: uuid
          example: v0a80123-0002-4444-9999-0123456789ab
        confirm_votes:
          type: integer
          example: 5
        reject_votes:
          type: integer
          example: 0
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - REJECTED
          example: VERIFIED
        message:
          type: string
          example: Version successfully verified by community consensus
    BeerVersionRejectRequest:
      type: object
      description: DTO відхилення версії модератором
      properties:
        reason:
          type: string
          maxLength: 1000
          example: Некоректний стиль товару
    ModerationDecisionRequest:
      type: object
      description: DTO рішення модератора щодо черги
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - PERMANENT_DELETE
          example: APPROVE
        comment:
          type: string
          maxLength: 1000
          example: Схвалено після перевірки
    ModerationDecisionResponse:
      type: object
      description: Результат рішення модератора
      required:
      - beer_id
      - decision
      - processed_at
      properties:
        beer_id:
          type: string
          format: uuid
          example: b0a80123-0999-4444-9999-0123456789ab
        decision:
          type: string
          example: APPROVE
        processed_at:
          type: string
          format: date-time
          example: '2026-10-20T12:35:00Z'
    BeerMergeRequest:
      type: object
      description: DTO злиття двох товарів-дублікатів
      required:
      - source_beer_id
      - target_beer_id
      properties:
        source_beer_id:
          type: string
          format: uuid
          example: b0a80123-0299-4444-9999-0123456789ab
        target_beer_id:
          type: string
          format: uuid
          example: b0a80123-0012-4444-9999-0123456789ab
    BeerMergeResponse:
      type: object
      description: Підсумок адміністративного злиття дублікатів
      required:
      - target_beer_id
      - migrated_consumptions_count
      - migrated_packagings_count
      - archived_reviews_count
      - status
      properties:
        target_beer_id:
          type: string
          format: uuid
          example: b0a80123-0012-4444-9999-0123456789ab
        migrated_consumptions_count:
          type: integer
          example: 47
        migrated_packagings_count:
          type: integer
          example: 2
        archived_reviews_count:
          type: integer
          example: 12
        status:
          type: string
          example: MERGED
    ConsumptionEntryCreateRequest:
      type: object
      description: DTO фіксації факту споживання
      required:
      - beer_id
      - packaging_id
      - quantity
      - consumed_at
      properties:
        beer_id:
          type: string
          format: uuid
          example: b0a80123-0001-4444-9999-0123456789ab
        packaging_id:
          type: string
          format: uuid
          example: p0a80123-0001-4444-9999-0123456789ab
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: Кількість одиниць (від 1 до 100)
          example: 2
        consumed_at:
          type: string
          format: date-time
          description: Часова мітка моменту споживання (ISO 8601)
          example: '2026-09-20T20:30:00Z'
    ConsumptionEntryResponse:
      type: object
      description: Представлення зафіксованого запису споживання
      required:
      - id
      - beer_id
      - packaging_id
      - quantity
      - total_volume_ml
      - consumed_at
      - created_at
      - wishlist_autoremoved
      - collection_added
      properties:
        id:
          type: string
          format: uuid
          example: c0a80123-9901-4444-9999-0123456789ab
        beer_id:
          type: string
          format: uuid
          example: b0a80123-0001-4444-9999-0123456789ab
        packaging_id:
          type: string
          format: uuid
          example: p0a80123-0001-4444-9999-0123456789ab
        quantity:
          type: integer
          example: 2
        total_volume_ml:
          type: integer
          description: Розрахований сервером підсумковий об'єм у мл
          example: 1000
        consumed_at:
          type: string
          format: date-time
          example: '2026-09-20T20:30:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-09-20T20:30:01Z'
        wishlist_autoremoved:
          type: boolean
          description: Ознака автоочищення товару з Wishlist
          example: true
        collection_added:
          type: boolean
          description: Ознака додавання сорту пива до Collection
          example: true
        beer_name:
          type: string
          nullable: true
          example: Mova Dark Stout
        packaging_volume_ml:
          type: integer
          nullable: true
          example: 500
    ConsumptionPagedResponse:
      type: object
      description: Сторінкова відповідь журналу споживання
      required:
      - items
