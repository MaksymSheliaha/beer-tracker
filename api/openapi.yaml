      x-req-id:
      - REQ-F-004
      - REQ-F-005
      - REQ-NF-008
      - REQ-NF-009
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор версії (UUID)
        schema:
          type: string
          format: uuid
          example: 40a80123-0002-4444-9999-0123456789ab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerVersionVoteRequest'
            examples:
              confirm_vote:
                summary: Голос CONFIRM
                value:
                  vote_type: CONFIRM
              reject_vote:
                summary: Голос REJECT
                value:
                  vote_type: REJECT
