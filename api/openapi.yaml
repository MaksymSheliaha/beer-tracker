components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступу формату JWT у заголовку Authorization за схемою Bearer
  schemas:
    ErrorResponse:
      type: object
      description: Єдина стандартизована модель помилки для всіх відповідей 4xx та 5xx
      required:
      - code
      - message
      - details
      - timestamp
      - traceId
      properties:
        code:
          type: string
          description: Машиночитний код помилки
          example: UNPROCESSABLE_ENTITY
        message:
          type: string
          description: Людиночитне узагальнене повідомлення про помилку
          example: Validation failed for one or more fields
        details:
          type: array
          description: Масив конкретних деталей помилок за полями
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          description: Часова мітка виникнення помилки в UTC
          example: '2026-10-20T18:30:00Z'
        traceId:
          type: string
          format: uuid
          description: Унікальний ідентифікатор запиту для трасування та діагностики
          example: c0a80123-7777-4444-9999-0123456789ab
    ErrorDetail:
      type: object
      description: Деталь помилки конкретного параметра чи інваріанта
      required:
      - field
      - issue
      properties:
        field:
          type: string
          description: Назва поля запиту, заголовка або бізнес-правила
          example: quantity
        issue:
          type: string
          description: Пояснення причини невалідності
          example: Quantity must be an integer between 1 and 100
    UserRegisterRequest:
      type: object
      description: Дані запиту на реєстрацію нового користувача
      required:
      - email
      - password
      - timezone
      properties:
        email:
          type: string
          format: email
          description: Унікальна електронна пошта користувача
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Пароль користувача (мінімум 8 символів)
          example: SuperSecretPassword123!
        timezone:
          type: string
          description: Часовий пояс IANA
          example: Europe/Kyiv
    UserLoginRequest:
      type: object
      description: Дані запиту для автентифікації користувача
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SuperSecretPassword123!
    RefreshTokenRequest:
      type: object
      description: Дані запиту на оновлення пари токенів доступу
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Діючий одноразовий Refresh токен
          example: 50a80123-9999-4444-8888-0123456789ab
    TokenResponse:
      type: object
      description: Пара токенів доступу та оновлення
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT Access токен (термін дії 15 хв)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.token
        refresh_token:
          type: string
          description: Ротований Refresh токен (термін дії 30 днів)
          example: 50a80123-9999-4444-8888-0123456789ab
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Час життя Access токена в секундах
          example: 900
    UserResponse:
      type: object
      description: Профіль облікового запису користувача
      required:
      - id
      - email
      - role
      - timezone
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 10a80123-4201-4444-9999-0123456789ab
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum:
          - USER
          - MODERATOR
          example: USER
        timezone:
          type: string
          example: Europe/Kyiv
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00Z'
    BeerPackagingCreateRequest:
      type: object
