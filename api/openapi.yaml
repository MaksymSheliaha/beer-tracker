  /beer-versions/{id}/votes:
    post:
      tags:
      - Versioning
      summary: Голосування за версію продукту (CONFIRM або REJECT)
      description: |-
        Реєструє голос користувача на підтвердження (`CONFIRM`) або відхилення (`REJECT`) запропонованої версії продукту.

        **Правила голосування:**
        - Автор версії не має права голосувати за власну пропозицію (`403 Forbidden`);
        - Повторне голосування одного користувача за ту саму версію заборонено (`409 Conflict`);
        - Після накопичення 5 голосів `CONFIRM` версія автоматично переходить у статус `VERIFIED` і стає актуальною в каталозі;
        - Після накопичення 5 голосів `REJECT` версія переходить у статус `REJECTED`, а новий неперевірений продукт передається в чергу модерації.
